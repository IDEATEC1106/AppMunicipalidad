name: Compilar APK Flutter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generar estructura nativa de Flutter (Gradle / Android)
        run: |
          # Guardar nuestros archivos principales
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/
          cp pubspec.yaml temp_backup/
          if [ -f "escudo3_MDG.png" ]; then cp escudo3_MDG.png temp_backup/; fi
          
          # Crear proyecto limpio de Flutter encima del repositorio
          flutter create . --org com.municipalidad.guadalupe --project-name app_municipalidad --force
          
          # Restaurar nuestros archivos personalizados
          cp temp_backup/main.dart lib/
          cp temp_backup/pubspec.yaml ./
          if [ -f "temp_backup/escudo3_MDG.png" ]; then cp temp_backup/escudo3_MDG.png ./; fi

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
