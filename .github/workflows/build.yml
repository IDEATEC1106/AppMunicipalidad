name: Compilar APK con Buildozer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: runs-on: ubuntu-22.04  # Cambiar de ubuntu-latest (o ubuntu-24.04) a ubuntu-22.04

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema de Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip build-essential libffi-dev libssl-dev \
          python3-dev python3-pip python3-setuptools \
          libtool autoconf automake gettext autopoint

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Limpiar compilaciones anteriores
      run: |
        buildozer clean || true
    - name: Fix Autotools Macro Paths for Buildozer
      run: |
        echo "ACLOCAL_PATH=/usr/share/aclocal" >> $GITHUB_ENV
        # Ensures libtool macro files are visible to aclocal
        sudo ln -sf /usr/share/aclocal/libtool.m4 /usr/share/aclocal/ltoptions.m4 /usr/share/aclocal/ltsugar.m4 /usr/share/aclocal/ltversion.m4 /usr/share/aclocal/lt~obsolete.m4 2>/dev/null || true
    
    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: paquete-apk
        path: bin/*.apk
