name: Compilar APK Flutter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generar estructura nativa de Flutter si no existe
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.municipalidad.guadalupe --project-name app_municipalidad
          fi

      - name: Configurar permisos de red y tráfico Cleartext en Android
        run: |
          # Crear el directorio res/xml si no existe
          mkdir -p android/app/src/main/res/xml

          # Crear el archivo network_security_config.xml para permitir conexiones IP directas
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          echo "Archivo network_security_config.xml creado correctamente."

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
