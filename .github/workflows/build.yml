name: Compilar APK Flutter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Forzar creación de estructura nativa completa de Flutter
        run: |
          # Eliminar cualquier rastro antiguo para evitar conflictos
          rm -rf android ios linux macos windows web .dart_tool
          
          # Crear un proyecto nuevo limpio con soporte completo para Android
          flutter create . --org com.municipalidad.guadalupe --project-name app_municipalidad

      - name: Configurar permisos de red y tráfico Cleartext en Android
        run: |
          # Asegurar que el directorio res/xml existe
          mkdir -p android/app/src/main/res/xml

          # Crear el archivo network_security_config.xml para permitir conexiones IP directas
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          # Modificar el AndroidManifest.xml para inyectar el permiso de Internet y la config de red
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          
          # Insertar uses-permission de internet si no existe
          if ! grep -q "android.permission.INTERNET" "$MANIFEST_PATH"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST_PATH"
          fi

          # Agregar networkSecurityConfig y usesCleartextTraffic a la etiqueta application
          sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config" android:usesCleartextTraffic="true"/' "$MANIFEST_PATH"

          echo "Configuración de red de Android inyectada correctamente."

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
